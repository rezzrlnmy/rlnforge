name: Android

# Gradle cannot run on the dev VM (Java network is blocked there), so CI is
# the build authority for rlnForge. No Gradle wrapper is committed; the
# setup-gradle action provides Gradle 8.2 (required by AGP 8.2.2).
on:
  push:
    branches: ["main", "v01-chat-provider"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rlnforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
